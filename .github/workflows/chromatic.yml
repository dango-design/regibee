name: Chromatic

# Runs on push, not pull_request. Chromatic's docs advise this because a
# pull_request run tests GitHub's temporary merge commit, which has no baseline.
on: push

# A newer push to a branch stops that branch's older run. If the older run had
# not sent its Storybook to Chromatic yet, its snapshots are never taken. Runs
# on main are never stopped: each merge keeps its own build.
concurrency:
  group: chromatic-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # onlyChanged needs the full git history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: chromaui/action@v18.13.6
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # chromatic.config.json turns on onlyChanged (only snapshot stories the
          # commit affects) and lists the files left out of that check.
          autoAcceptChanges: main # builds on main accept their changes, so merged work becomes the baseline
