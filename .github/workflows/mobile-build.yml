name: Android testing build

# Starts a new Android testing build, uploaded to Google Play's internal
# testing track, when a merge to main changes the app's native code.
#
# Over-the-air updates (mobile-update.yml) only reach builds whose native code
# matches. Before this workflow, a change to native code needed someone to
# build by hand, and testers stayed on an old build that no update reached.
# mobile/scripts/testing-build.mjs compares the native code's fingerprint with
# the testing builds on EAS and starts a build only when none has it, so most
# merges start nothing. See "Android testers" in mobile/README.md.
#
# It needs the EXPO_TOKEN repo secret, the same one the App update workflow
# uses. Without it, the run says so and builds nothing. iPhone builds wait for
# the Apple Developer account.
on:
  push:
    branches: [main]
    # Native code only lives in mobile/, and in the product reader, which the
    # iPhone share extension runs. Other merges can't change the fingerprint.
    paths:
      - mobile/**
      - extension/src/product-reader.ts
      - .github/workflows/mobile-build.yml
  workflow_dispatch:

# One check at a time, so two merges in a row see each other's build and
# start only one.
concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  token:
    name: Expo token
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The EXPO_TOKEN secret isn't set, so no Android testing build was started. See mobile/README.md."
          fi

  build:
    name: Start a build if the native code changed
    needs: token
    if: needs.token.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      # Some history, so the build can name the newest pull request
      # (scripts/build-info.js).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # The build runs in Expo's cloud. This only starts it (--no-wait), and
      # EAS uploads it to Play when it finishes.
      - name: Start the build if needed
        run: node scripts/testing-build.mjs
