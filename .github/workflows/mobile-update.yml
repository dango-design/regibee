name: App update

# Publishes an over-the-air update to the app's preview builds when a merge to
# main changes something the app runs. Preview builds download it the next
# time they open, or from "Check for updates" on the Account tab, which also
# names the newest pull request in it. A change to native code makes a new
# runtime version that no installed build matches, so those need a new build.
# See "Updates" in mobile/README.md.
#
# The app runs mobile/ and the website files it imports through `@shared/*`,
# directly or through another shared file. The paths below name each of those
# files. mobile/scripts/check-update-paths.mjs fails when one is missing or no
# longer imported. The App update paths workflow runs it on pull requests, and
# so does `npm run check` in mobile/.
#
# It needs the EXPO_TOKEN repo secret, an Expo access token for the account
# that owns the project. Without it, the run says so and publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - src/lib/account-deletion-summary.ts
      - src/lib/analytics-urls.ts
      - src/lib/delete-confirmation.ts
      - src/lib/checklist-data.ts
      - src/lib/checklist-matching.ts
      - src/lib/dashboard-page-types.ts
      - src/lib/demo-data.ts
      - src/lib/edit-event-sections.ts
      - src/lib/email-address.ts
      - src/lib/event-colors.ts
      - src/lib/event-images.ts
      - src/lib/event-steps.ts
      - src/lib/event-updates.ts
      - src/lib/events-page-types.ts
      - src/lib/events.ts
      - src/lib/gift-ideas.ts
      - src/lib/gift-profile.ts
      - src/lib/gifts.ts
      - src/lib/group-gifts.ts
      - src/lib/groups.ts
      - src/lib/guest-emails.ts
      - src/lib/guest-follow-rules.ts
      - src/lib/guest-input.ts
      - src/lib/in-app.ts
      - src/lib/initials.ts
      - src/lib/invitation-page-types.ts
      - src/lib/item-categories.ts
      - src/lib/item-details.ts
      - src/lib/list-access.ts
      - src/lib/list-page-types.ts
      - src/lib/money.ts
      - src/lib/occasion-theme.ts
      - src/lib/occasions.ts
      - src/lib/people-page-types.ts
      - src/lib/profile-link.ts
      - src/lib/profile-photos.ts
      - src/lib/push.ts
      - src/lib/registry-copy.ts
      - src/lib/registry-listing.ts
      - src/lib/registry-photos.ts
      - src/lib/retailers.ts
      - src/lib/rsvp-questions.ts
      - src/lib/saved-items-types.ts
      - src/lib/shared-link.ts
      - src/lib/signups.ts
      - src/lib/step-nav.ts
      - src/lib/store-perks.ts
      - src/lib/types.ts
      - extension/src/product-reader.ts
      - .github/workflows/mobile-update.yml
  workflow_dispatch:

# One publish at a time, in order, so the newest merge is the newest update.
concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  token:
    name: Expo token
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The EXPO_TOKEN secret isn't set, so no app update was published. See mobile/README.md."
          fi

  update:
    name: Publish preview update
    needs: token
    if: needs.token.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      # Some history, so the app can name the newest pull request.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      # The Supabase URL and site URL that builds get from eas.json's `env`,
      # which is for builds. The anon key comes from the project's EAS
      # environment variables (--environment below).
      - name: Use the build profiles' settings
        run: node -e 'for (const [k, v] of Object.entries(require("./eas.json").build.base.env)) console.log(`${k}=${v}`)' >> "$GITHUB_ENV"

      # "#167 Let Android password managers fill the app's sign-in fields"
      - name: Publish
        run: |
          subject=$(git log -1 --format=%s)
          if [[ $subject =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            message="#${BASH_REMATCH[1]} $(git log -1 --format=%b | head -n 1)"
          else
            message="$subject"
          fi
          eas update --channel preview --environment preview --message "$message" --non-interactive
